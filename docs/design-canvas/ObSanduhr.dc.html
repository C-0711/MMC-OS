<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /* OS-Sprache: #FAF7F2 / Salbei #8FA98F / Rosé #D9A6A0 / Olivgold #B8A369
       Schrift: Serife 34/22 (400, nie fett) · Sans 15/13/11 · Radius 16/8/999 */
    body { margin: 0; }
    .os-grund {
      overflow: hidden; position: relative; display: flex; flex-direction: column;
      background: #FAF7F2; color: #2a2520;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-size: 15px; -webkit-font-smoothing: antialiased;
    }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.01em; }
    .t13 { font-size: 13px; }
    .t11 { font-size: 11px; }
    .sub { color: rgba(42,37,32,.55); }
    .mono { font-family: 'SF Mono', Menlo, Monaco, monospace; font-size: 11px; color: rgba(42,37,32,.6); }
    .ampel { display: flex; gap: 8px; }
    .ampel span { width: 12px; height: 12px; border-radius: 999px; display: block; }
    /* Sandkörner: Olivgold, 1px, sanfter Fade — 3–4 pro Sekunde, kein Regen */
    @keyframes korn {
      0%   { transform: translateY(0);    opacity: 0; }
      12%  { opacity: .9; }
      82%  { opacity: .9; }
      100% { transform: translateY(46px); opacity: 0; }
    }
    .korn {
      position: absolute; left: 50%; top: 0; width: 1px; height: 1px;
      background: #B8A369; border-radius: 999px;
      animation: korn 1.1s linear infinite;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap">
</helmet>

<div class="os-grund" style="width: 1360px; height: 900px; align-items: center; justify-content: center; background: linear-gradient(165deg, #f2ece1, #e9e0d0)">
  <div style="width: 1180px; height: 780px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: #FAF7F2; box-shadow: 0 30px 80px -24px rgba(70,58,38,.45), 0 0 0 .5px rgba(70,58,38,.2)">
    <div style="flex: none; height: 52px; display: flex; align-items: center; padding: 0 16px">
      <div class="ampel"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 0 80px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div class="serif" style="font-size: 22px">Verstanden: 9.500 Seiten.</div>
        <div class="t13 sub">Was davon heute wichtig ist, liegt oben auf.</div>
      </div>

      <!-- Die Sanduhr: winzig, Haarlinie, Tinte auf Warmweiß. Eine Sanduhr, die Zeit hat. -->
      <div style="position: relative; width: 24px; height: 130px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:block">
          <path d="M4.5 2.5 H19.5 M4.5 21.5 H19.5 M6 2.5 C6 8 10.5 10.5 11.6 12 C10.5 13.5 6 16 6 21.5 M18 2.5 C18 8 13.5 10.5 12.4 12 C13.5 13.5 18 16 18 21.5"
                stroke="#2a2520" stroke-width="0.75" stroke-linecap="round"/>
          <!-- Sand oben: Olivgold, halb geleert -->
          <path d="M8.4 7.5 C9.4 9.4 11 10.6 11.6 11.4 L12.4 11.4 C13 10.6 14.6 9.4 15.6 7.5 Z" fill="rgba(184,163,105,.55)"/>
          <!-- Sand unten: der kleine Hügel im Glas -->
          <path d="M7.6 21 C9 18.6 11 17.6 12 17.6 C13 17.6 15 18.6 16.4 21 Z" fill="rgba(184,163,105,.75)"/>
        </svg>
        <!-- 4 Körner pro Sekunde, versetzt, unter der Taille -->
        <div style="position: absolute; left: 0; top: 26px; width: 24px; height: 46px">
          <span class="korn" style="animation-delay: 0s"></span>
          <span class="korn" style="animation-delay: .28s; margin-left: -1px"></span>
          <span class="korn" style="animation-delay: .55s"></span>
          <span class="korn" style="animation-delay: .83s; margin-left: 1px"></span>
        </div>
        <!-- Unten liegt ein Hügel, und der Hügel ist der Bericht -->
        <svg width="220" height="34" viewBox="0 0 220 34" style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%)">
          <path d="M6 32 C60 32 84 12 110 12 C136 12 160 32 214 32 Z" fill="rgba(184,163,105,.28)"/>
          <path d="M40 32 C78 32 94 20 110 20 C126 20 142 32 180 32 Z" fill="rgba(184,163,105,.34)"/>
        </svg>
      </div>

      <div class="t11 sub" style="max-width: 46ch; text-align: center; line-height: 1.7">Der Hügel unten ist der Bericht. Er wächst still — Themen entstehen erst, wenn du sie aufnimmst.</div>
    </div>

    <!-- Zahlen als Mono-Fußnoten: Fundstellen-Register, kein Dashboard -->
    <div style="flex: none; display: flex; justify-content: center; padding: 0 0 26px">
      <div class="mono">2.146 / 9.500 gelesen · alles committet vor Deutung · fall·ingest · signatur ✓</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
