<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gitchain OS — Prototyp v0.1</title>
<style>
  :root {
    --canvas: #FAF7F2;
    --tinte: #2E2A26;
    --salbei: #8FA98F;
    --salbei-soft: #EAF0EA;
    --beige: #E8DFD3;
    --beige-soft: #F3EEE7;
    --rose: #D9A6A0;
    --rose-soft: #F7ECEA;
    --gold: #B8A369;
    --hairline: #E8DFD3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--canvas); color: var(--tinte);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .mono { font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: #8A817A; }

  /* ── Leiste ── */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; border-bottom: 1px solid var(--hairline);
  }
  .seal {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--gold), #96854F);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .zustand { font-size: 13px; color: #8A817A; }
  .zustand b { color: var(--tinte); font-weight: 500; }

  /* ── Bühne ── */
  main { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; padding: 48px 28px 120px; }
  .gruss { font-size: 34px; line-height: 1.25; margin-bottom: 6px; }
  .gruss-klein { font-size: 17px; color: #8A817A; margin-bottom: 34px; }
  .alles-ruhig { font-size: 20px; color: var(--salbei); font-style: italic; padding: 40px 0; text-align: center; }

  /* ── Karten ── */
  .karte {
    background: #fff; border: 1px solid var(--hairline); border-radius: 16px;
    padding: 22px 24px; margin-bottom: 14px;
    transition: box-shadow .2s; cursor: pointer;
  }
  .karte:hover { box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  .karte.warn { border-left: 4px solid var(--rose); }
  .karte.info { border-left: 4px solid var(--gold); }
  .karte h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .karte p { font-size: 14px; color: #5A524B; line-height: 1.5; }
  .karte .fundstelle { margin-top: 12px; }
  .karte .fundstelle:hover { color: var(--salbei); }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 20px; border-radius: 100px; border: none; cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  .btn-primary { background: var(--salbei); color: #fff; }
  .btn-primary:hover { opacity: .9; }
  .btn-secondary { background: var(--beige-soft); color: var(--tinte); }
  .btn-ghost { background: transparent; color: #8A817A; }

  /* ── Beweis ── */
  .beweis { display: none; margin-top: 8px; }
  .beweis offen { display: block; }
  .doc-viewer {
    background: #fff; border: 1px solid var(--hairline); border-radius: 12px;
    padding: 24px; margin: 14px 0; position: relative;
  }
  .doc-title { font-size: 12px; color: #8A817A; margin-bottom: 10px; }
  .doc-zeile { font-size: 14px; padding: 6px 8px; border-radius: 6px; display: flex; justify-content: space-between; }
  .doc-zeile.highlight {
    background: rgba(143,169,143,.22); outline: 2px solid var(--salbei);
    font-weight: 600;
  }

  /* ── Frag mich ── */
  .frag-mich {
    position: fixed; bottom: 24px; right: 28px;
    background: #fff; border: 1px solid var(--hairline); border-radius: 100px;
    padding: 12px 22px; cursor: pointer; font-size: 14px; color: #8A817A;
    box-shadow: 0 4px 16px rgba(0,0,0,.08); transition: all .2s;
  }
  .frag-mich:hover { color: var(--tinte); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .dialog-panel {
    position: fixed; bottom: 80px; right: 28px; width: 400px; max-height: 60vh;
    background: #fff; border: 1px solid var(--hairline); border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.12); display: none;
    flex-direction: column; overflow: hidden;
  }
  .dialog-panel.offen { display: flex; }
  .dialog-log { overflow-y: auto; padding: 18px; flex: 1; }
  .antwort { font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
  .antwort .zitat {
    display: block; background: var(--salbei-soft); border-radius: 8px;
    padding: 8px 12px; margin-top: 8px; font-size: 12px; color: #5A7054;
  }
  .antwort .zitat:hover { outline: 1px solid var(--salbei); }
  .dialog-input { display: flex; border-top: 1px solid var(--hairline); }
  .dialog-input input {
    flex: 1; border: none; padding: 14px 18px; font-size: 14px;
    font-family: inherit; background: transparent; outline: none; color: var(--tinte);
  }
  .dialog-input button { background: transparent; color: var(--salbei); padding: 0 18px; }

  /* ── Fall-Ansicht (Erzählung) ── */
  .erzaehlung { margin-top: 6px; }
  .ereignis { padding: 10px 0 10px 18px; border-left: 2px solid var(--beige); position: relative; }
  .ereignis::before {
    content: ""; position: absolute; left: -5px; top: 16px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--beige);
  }
  .ereignis .text { font-size: 14px; color: var(--tinte); line-height: 1.5; }
  .ereignis .raw { display: none; margin-top: 4px; }
  .ereignis.offen .raw { display: block; }

  /* ── Toast ── */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: var(--tinte); color: #fff; font-size: 13px;
    padding: 10px 22px; border-radius: 100px; opacity: 0;
    transition: opacity .3s; pointer-events: none;
  }
  .toast.sichtbar { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="seal" title="Du — Identität, Autonomie, Recovery">🔏</div>
  <div class="zustand" id="zustand">heute · <b id="zustand-offen">1 offen</b></div>
</header>

<main>
  <div class="gruss serif">Guten Morgen.</div>
  <div class="gruss-klein" id="gruss-klein">Ein Ding wartet.</div>
  <div id="karten"></div>
  <div class="alles-ruhig serif" id="alles-ruhig" style="display:none">Alles ruhig.</div>
  <div class="erzaehlung" id="erzaehlung" style="display:none"></div>
</main>

<div class="frag-mich" id="frag-mich-toggle">💬 Frag mich</div>
<div class="dialog-panel" id="dialog-panel">
  <div class="dialog-log" id="dialog-log">
    <div class="antwort" style="color:#8A817A">Frag mich alles — ich antworte mit Beweis.</div>
  </div>
  <div class="dialog-input">
    <input id="dialog-eingabe" placeholder="z. B. Was habe ich mit Weber vereinbart?" autocomplete="off">
    <button id="dialog-senden">↑</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   gitchain OS — Vertikaler Prototyp v0.1
   Simuliert: Fall-Container, Atoms mit Fundstellen,
   Vorschlags-Karten, Beweis-Viewer, Frag-mich (Mini-Brain),
   Commit-Historie als Erzählung.
   ═══════════════════════════════════════════════════════════ */

// ── Der Mini-Container (Vault) ──────────────────────────────
const vault = {
  fall: {
    name: "steuern-2026",
    commits: [],
    atoms: [
      { id: 1042, text: "USt-Voranmeldung Q3 2026 fällig am 30.09.2026",
        fundstelle: { doc: "docs/fristen/ust-q3.ics", seite: 1, rect: "Frist", commit: "a41f" },
        sig: true },
      { id: 1043, text: "Rechnung 2026-118, Weber Bau GmbH, 1.190 € brutt",
        fundstelle: { doc: "docs/rechnungen/2026-118.pdf", seite: 1, rect: "Gesamtbetrag", commit: "b92c" },
        sig: true },
    ]
  }
};

// ── Offene Vorschläge (Karten-Queue, max. 3) ────────────────
let vorschlaege = [
  {
    id: "ust-q3",
    typ: "warn",
    titel: "Umsatzsteuer-Voranmeldung Q3",
    frage: "Soll ich die USt machen? Sie ist in 2 Tagen fällig.",
    detail: "12 Belege erkannt · 4 mit Fundstelle offen",
    atom: 1042,
    aktion: "Voranmeldung vorbereiten (Vorschlag an Buhl-Partner)",
    risiko: "R2 — immer Vorschlag"
  }
];

// ── Rendering ───────────────────────────────────────────────
function render() {
  const kartenEl = document.getElementById("karten");
  kartenEl.innerHTML = "";
  vorschlaege.forEach(v => {
    const atom = vault.fall.atoms.find(a => a.id === v.atom);
    const karte = document.createElement("div");
    karte.className = `karte ${v.typ}`;
    karte.innerHTML = `
      <h3>${v.titel}</h3>
      <p>${v.frage}</p>
      <p style="font-size:12px;color:#8A817A;margin-top:4px">${v.detail} · ${v.risiko}</p>
      <div class="fundstelle mono" data-atom="${v.atom}">▸ Beweis zeigen · ${vault.fall.name} · ${atom.fundstelle.doc} · S.${atom.fundstelle.seite} · commit ${atom.fundstelle.commit} · sig ✓</div>
      <div class="beweis" id="beweis-${v.id}"></div>
      <div class="btn-row">
        <button class="btn-primary" onclick="bestaetigen('${v.id}')">Ja, machen</button>
        <button class="btn-secondary" onclick="spaeter('${v.id}')">Später</button>
        <button class="btn-ghost" onclick="ablehnen('${v.id}')">Nein</button>
      </div>`;
    kartenEl.appendChild(karte);
  });
  document.getElementById("alles-ruhig").style.display =
    vorschlaege.length === 0 ? "block" : "none";
  document.getElementById("gruss-klein").textContent =
    vorschlaege.length === 0 ? "Alles erledigt." :
    vorschlaege.length === 1 ? "Ein Ding wartet." :
    `${vorschlaege.length} Dinge warten.`;
  document.getElementById("zustand-offen").textContent =
    vorschlaege.length === 0 ? "alles ruhig" : `${vorschlaege.length} offen`;
  renderErzaehlung();
}

// ── Beweis-Viewer ───────────────────────────────────────────
document.addEventListener("click", e => {
  if (e.target.classList.contains("fundstelle")) {
    const atomId = parseInt(e.target.dataset.atom);
    const atom = vault.fall.atoms.find(a => a.id === atomId);
    const beweisEl = e.target.parentElement.querySelector(".beweis");
    const offen = beweisEl.classList.toggle("offen");
    if (offen) {
      beweisEl.innerHTML = `
        <div class="doc-viewer">
          <div class="doc-title mono">${atom.fundstelle.doc} — Seite ${atom.fundstelle.seite}</div>
          <div class="doc-zeile"><span>Rechnung 2026-118</span><span>Weber Bau GmbH</span></div>
          <div class="doc-zeile"><span>Leistung: Dachabdichtung</span><span>03.08.2026</span></div>
          <div class="doc-zeile"><span>Netto</span><span>1.000,00 €</span></div>
          <div class="doc-zeile"><span>USt 19 %</span><span>190,00 €</span></div>
          <div class="doc-zeile highlight"><span>${atom.fundstelle.rect}: Gesamtbetrag brutto</span><span>1.190,00 €</span></div>
          <div class="mono" style="margin-top:12px">${vault.fall.name} · ${atom.fundstelle.doc} · S.${atom.fundstelle.seite} · commit ${atom.fundstelle.commit} · sig ${atom.sig ? "✓" : "✗"}</div>
        </div>`;
    }
  }
});

// ── Entscheidungen (Commit-Ereignisse) ──────────────────────
function bestaetigen(id) {
  const v = vorschlaege.find(x => x.id === id);
  vault.fall.commits.push({
    ts: new Date().toISOString(), aktion: v.aktion, quelle: v.atom,
    entschieden: "ja (tap)", hash: Math.random().toString(16).slice(2, 6)
  });
  vorschlaege = vorschlaege.filter(x => x.id !== id);
  toast(`Erledigt — committet im Fall ${vault.fall.name}`);
  render();
}
function spaeter(id) {
  const v = vorschlaege.find(x => x.id === id);
  vault.fall.commits.push({ ts: new Date().toISOString(), aktion: `„${v.titel}" auf später gelegt`, quelle: v.atom, entschieden: "später (tap)" });
  vorschlaege = vorschlaege.filter(x => x.id !== id);
  toast("Später — die Karte kehrt zurück");
  render();
}
function ablehnen(id) {
  const v = vorschlaege.find(x => x.id === id);
  vault.fall.commits.push({ ts: new Date().toISOString(), aktion: `„${v.titel}" abgelehnt`, quelle: v.atom, entschieden: "nein (tap)" });
  vorschlaege = vorschlaege.filter(x => x.id !== id);
  toast("Abgelehnt — die KI lernt daraus (Memory-Commit)");
  render();
}

// ── Fall-Ansicht: Erzählung statt Tabelle ───────────────────
function renderErzaehlung() {
  const el = document.getElementById("erzaehlung");
  el.innerHTML = "<h3 class='serif' style='margin-bottom:14px'>Fall: steuern-2026</h3>";
  const ereignisse = [
    { text: "Am 3. August kam die Rechnung von Weber (1.190 € brutto).", raw: "commit b92c · +1 atom · sig ✓" },
    { text: "Du hast sie am selben Tag bestätigt — sie gehört zu Q3.", raw: "commit c01d · merge nach main · four-eyes ✓" },
    ...vault.fall.commits.map(c => ({
      text: `${new Date(c.ts).toLocaleDateString("de-DE")}: ${c.aktion} (${c.entschieden}).`,
      raw: `commit ${c.hash || "----"} · quelle: atom ${c.quelle || "—"}`
    }))
  ];
  ereignisse.forEach(e => {
    const div = document.createElement("div");
    div.className = "ereignis";
    div.innerHTML = `<div class="text">${e.text}</div><div class="raw mono">${e.raw}</div>`;
    div.onclick = () => div.classList.toggle("offen");
    el.appendChild(div);
  });
  el.style.display = "block";
}

// ── Frag mich (Mini-Brain: retrieve-then-resolve) ───────────
document.getElementById("frag-mich-toggle").onclick = () =>
  document.getElementById("dialog-panel").classList.toggle("offen");

function fragBeantworten(q) {
  const ql = q.toLowerCase();
  const treffer = vault.fall.atoms.filter(a =>
    a.text.toLowerCase().split(/\W+/).some(w => w.length > 3 && ql.includes(w))
  );
  if (treffer.length) {
    return treffer.map(a =>
      `<div class="antwort">Ich habe das hier gefunden:
        <span class="zitat">📄 ${a.text}<br>
        <span class="mono">${vault.fall.name} · ${a.fundstelle.doc} · S.${a.fundstelle.seite} · commit ${a.fundstelle.commit} · sig ✓</span></span>
      </div>`).join("");
  }
  return `<div class="antwort" style="color:#8A817A">Dazu habe ich im Fall <b>${vault.fall.name}</b> nichts Belegtes gefunden. Was nicht geprüft werden konnte, gilt nicht als geprüft — willst du es als ungeklärt ablegen?</div>`;
}

document.getElementById("dialog-senden").onclick = sende;
document.getElementById("dialog-eingabe").addEventListener("keydown", e => { if (e.key === "Enter") sende(); });
function sende() {
  const input = document.getElementById("dialog-eingabe");
  if (!input.value.trim()) return;
  const log = document.getElementById("dialog-log");
  log.insertAdjacentHTML("beforeend", `<div class="antwort" style="text-align:right;color:#8A817A">${input.value}</div>`);
  log.insertAdjacentHTML("beforeend", fragBeantworten(input.value));
  input.value = "";
  log.scrollTop = log.scrollHeight;
}

// ── Toast ───────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("sichtbar");
  setTimeout(() => t.classList.remove("sichtbar"), 2400);
}

render();
</script>
</body>
</html>
